<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="Calculator">

    <H2>Mini Calculator</H2>


    <input type="number" class="input-box" id="num1" placeholder="Enter first number">
    <input type="number" class="input-box" id="num2" placeholder="Enter second number">


    <button type="button" class="btn" id="add">add</button>
    <button type="button" class="btn" id="sub">subtract</button>

    <button type="button" class="btn" id="mul">multiply</button>

    <button type="button" class="btn" id="divi">divide</button>

    <button class="btn" id="clr">clear</button>

    <button class="btn" id="backspace">Backspace</button>

    

    <p id="res" class="resu">result :</p>
    
    <div class="number-button">

        <button class="num-btn">1</button>
        <button class="num-btn">2</button>
        <button class="num-btn">3</button>
        <button class="num-btn">4</button>
        <button class="num-btn">5</button>
        <button class="num-btn">6</button>
        <button class="num-btn">7</button>
        <button class="num-btn">8</button>
        <button class="num-btn">9</button>
        <button class="num-btn">0</button>
    </div>

    
</div>
<script src="index.js"></script>
</body>
</html>
